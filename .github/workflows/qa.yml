name: QA

# Three runners, one set of scenarios:
#   web     → Playwright on ubuntu-latest
#   android → Appium + Android emulator on ubuntu-latest
#   ios     → Appium + iOS simulator on macos-14 (Xcode required)

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 19 * * *' # 01:00 IST nightly
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run'
        type: choice
        options: [smoke, e2e, all]
        default: smoke

concurrency:
  group: qa-${{ github.ref }}-${{ inputs.suite || 'smoke' }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · ${{ inputs.suite || 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cp .env.example .env

      - name: Smoke
        if: ${{ inputs.suite == 'smoke' || inputs.suite == '' }}
        run: npm run test:web:smoke
        env:
          CI: true

      - name: E2E
        if: ${{ inputs.suite == 'e2e' || inputs.suite == 'all' }}
        run: npm run test:web:e2e
        env:
          CI: true

      - name: Regression
        if: ${{ github.event_name == 'schedule' || inputs.suite == 'all' }}
        run: npm run test:web:regression
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-report
          path: reports/
          retention-days: 14

  android:
    name: Android emulator · ${{ inputs.suite || 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - run: npm ci
      - run: npx appium driver install uiautomator2 || true
      - run: cp .env.example .env

      - name: Fetch the APK
        # Publish the release APK from the application repo as an artifact or a
        # release asset and point APK_URL at it; this repo never builds the app.
        run: |
          mkdir -p build/app
          curl -fsSL "$APK_URL" -o build/app/app-release.apk
        env:
          APK_URL: ${{ vars.APK_URL }}

      - name: Run smoke + e2e on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: ANDROID_APP_PATH=build/app/app-release.apk npm run test:android:all

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-report
          path: reports/android/
          retention-days: 14

  ios:
    name: iOS simulator · ${{ inputs.suite || 'smoke' }}
    runs-on: macos-14
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx appium driver install xcuitest || true
      - run: cp .env.example .env

      - name: Boot simulator
        run: |
          xcrun simctl list devices available | grep -i iphone | head
          xcrun simctl boot "iPhone 15" || true

      - name: Run smoke + e2e on the simulator
        run: IOS_APP_PATH="$IOS_APP" IOS_DEVICE_NAME="iPhone 15" npm run test:ios:all
        env:
          IOS_APP: ${{ vars.IOS_APP_PATH }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-report
          path: reports/ios/
          retention-days: 14
