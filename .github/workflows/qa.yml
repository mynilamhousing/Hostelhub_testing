name: QA

# Smoke on every push to the app branch, regression nightly and on demand.
# Secrets required:
#   WEB_BASE_URL, API_BASE_URL  (repository variables, optional — defaults are in src/config/env.js)

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 19 * * *' # 01:00 IST nightly
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run'
        type: choice
        options: [smoke, e2e, regression, all]
        default: smoke

concurrency:
  group: qa-${{ github.ref }}-${{ inputs.suite || 'smoke' }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (${{ inputs.suite || 'smoke' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Prepare env
        run: cp .env.example .env
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://hostelhub.mynilam.in' }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://hostelhub.mynilamhousing.workers.dev' }}

      - name: Smoke
        if: ${{ inputs.suite == 'smoke' || inputs.suite == '' }}
        run: npm run test:smoke
        env:
          CI: true

      - name: E2E
        if: ${{ inputs.suite == 'e2e' || inputs.suite == 'all' }}
        run: npm run test:e2e
        env:
          CI: true

      - name: Regression
        if: ${{ github.event_name == 'schedule' || inputs.suite == 'regression' || inputs.suite == 'all' }}
        run: npm run test:regression
        env:
          CI: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          retention-days: 14
